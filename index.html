<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾爾斯 HR 自動化系統</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;background:#f4f3ef;color:#1a1917;min-height:100vh;font-size:15px}
.welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:32px;padding:32px}
.welcome-logo{font-size:28px;font-weight:700;letter-spacing:0.04em;text-align:center}
.welcome-sub{font-size:15px;color:#6b6966;margin-top:6px;text-align:center}
.flow-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:700px;width:100%} .flow-cards .flow-card:last-child{grid-column:1/-1}
.flow-card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:14px;padding:28px 20px;cursor:pointer;transition:all 0.15s;text-align:center}
.flow-card:hover{border-color:rgba(0,0,0,0.25);transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.flow-card-icon{font-size:32px;margin-bottom:12px}
.flow-card-title{font-size:16px;font-weight:700;margin-bottom:6px}
.flow-card-desc{font-size:13px;color:#6b6966;line-height:1.5}
.app{display:none;min-height:100vh;flex-direction:column}
.app.active{display:flex}
.header{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.1);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.header-back{cursor:pointer;font-size:13px;color:#6b6966;display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.12);background:transparent;font-family:inherit;transition:background 0.1s}
.header-back:hover{background:#f4f3ef}
.header-title{font-size:16px;font-weight:700}
.header-badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600}
.badge-green{background:#e3f5ed;color:#0f6e56}
.badge-amber{background:#fdf0d9;color:#7a4f0a}
.badge-red{background:#fde8e8;color:#8a1a1a}
.progress-wrap{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.08);padding:12px 28px;display:flex;align-items:center;gap:16px}
.progress-bar{flex:1;height:5px;background:#ebe9e3;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width 0.3s ease}
.fill-green{background:#1a7a55}.fill-amber{background:#c97a0a}.fill-red{background:#c72c2c}
.progress-text{font-size:12px;color:#6b6966;white-space:nowrap}
.main{display:flex;flex:1}
.sidebar{width:240px;background:#fff;border-right:0.5px solid rgba(0,0,0,0.08);padding:20px 0;flex-shrink:0;position:sticky;top:72px;height:calc(100vh - 72px);overflow-y:auto}
.step-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:background 0.1s;border-left:3px solid transparent}
.step-item:hover{background:#f8f7f3}
.step-item.active{background:#f0efe9;border-left-color:#1a1917}
.step-item.done .step-num{background:#1a7a55;color:#fff;border-color:#1a7a55}
.step-num{width:24px;height:24px;border-radius:50%;border:1.5px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:#6b6966}
.step-label{font-size:13px;color:#3a3937;line-height:1.4}
.step-item.active .step-label{font-weight:600;color:#1a1917}
.content{flex:1;padding:28px 32px;max-width:820px}
.section-card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:14px;padding:24px;margin-bottom:16px}
.section-title{font-size:17px;font-weight:700;margin-bottom:6px}
.section-desc{font-size:13px;color:#6b6966;margin-bottom:20px;line-height:1.6}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12px;font-weight:600;color:#3a3937;letter-spacing:0.02em}
.form-required{color:#c72c2c;margin-left:2px}
.form-input,.form-select{padding:9px 12px;border:0.5px solid rgba(0,0,0,0.18);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:#1a1917;outline:none;transition:border 0.1s}
.form-input:focus,.form-select:focus{border-color:#1a1917}
.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;border-left:3px solid;line-height:1.6}
.alert-info{background:#e3eef8;color:#1a4f8a;border-color:#1a4f8a}
.alert-warn{background:#fdf0d9;color:#7a4f0a;border-color:#c97a0a}
.alert-danger{background:#fde8e8;color:#8a1a1a;border-color:#c72c2c}
.alert-success{background:#e3f5ed;color:#0f6e56;border-color:#1a7a55}
.alert strong{font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:9px;border:0.5px solid rgba(0,0,0,0.15);background:transparent;font-size:13px;font-weight:600;color:#1a1917;cursor:pointer;font-family:inherit;transition:all 0.12s;text-decoration:none}
.btn:hover{background:#f4f3ef}
.btn-primary{background:#1a1917;color:#fff;border-color:#1a1917}
.btn-primary:hover{opacity:0.85;background:#1a1917}
.btn-green{background:#e3f5ed;color:#0f6e56;border-color:transparent}
.btn-green:hover{background:#cceedd}
.btn-amber{background:#fdf0d9;color:#7a4f0a;border-color:transparent}
.btn-red{background:#fde8e8;color:#8a1a1a;border-color:transparent}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.text-output{background:#f8f7f3;border:0.5px solid rgba(0,0,0,0.1);border-radius:10px;padding:16px;font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-all;margin-bottom:12px;max-height:400px;overflow-y:auto}
.checklist{display:flex;flex-direction:column;gap:8px}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:0.5px solid rgba(0,0,0,0.1);border-radius:10px;background:#fff;cursor:pointer;transition:all 0.1s}
.check-item:hover{border-color:rgba(0,0,0,0.2)}
.check-item.done{opacity:0.5;background:#f8f7f3}
.check-item.done .check-label{text-decoration:line-through;color:#9a9894}
.checkbox{width:20px;height:20px;border:1.5px solid #ccc;border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all 0.1s;font-size:12px}
.check-item.done .checkbox{background:#1a7a55;border-color:#1a7a55;color:#fff}
.check-label{font-size:14px;line-height:1.5;flex:1}
.check-note{font-size:12px;color:#9a9894;margin-top:2px}
.info-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.info-table td{padding:8px 12px;border-bottom:0.5px solid rgba(0,0,0,0.08)}
.info-table td:first-child{color:#6b6966;width:40%;font-weight:500}
.info-table td:last-child{font-weight:600}
.cal-link{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f8f7f3;border:0.5px solid rgba(0,0,0,0.1);border-radius:10px;margin-bottom:8px;text-decoration:none;color:#1a1917;transition:background 0.1s}
.cal-link:hover{background:#ebe9e3}
.cal-icon{font-size:20px}
.cal-info{flex:1}
.cal-title{font-size:13px;font-weight:600}
.cal-date{font-size:12px;color:#6b6966;margin-top:2px}
.calc-result{background:#f0efe9;border-radius:10px;padding:16px;margin-top:16px}
.calc-total{font-size:22px;font-weight:700;color:#1a7a55;margin-top:8px}
.nav-buttons{display:flex;justify-content:space-between;margin-top:28px;padding-top:20px;border-top:0.5px solid rgba(0,0,0,0.08)}
.cred-box{background:#f8f7f3;border-radius:10px;padding:14px;margin:12px 0;font-size:13px}

/* PDF Print Styles */
@media print {
  * { margin: 0; padding: 0; }
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area {
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    height: auto;
    overflow: visible;
    page-break-inside: avoid;
  }
  @page { margin: 10mm; size: A4; }
}

/* PDF Document Styles */
.pdf-doc{font-family:'Microsoft JhengHei',sans-serif;padding:40px;max-width:680px;margin:0 auto;line-height:1.8;font-size:14px}
.pdf-title{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:0.1em}
.pdf-company{text-align:center;font-size:16px;font-weight:700;margin-bottom:20px}
.pdf-subtitle{text-align:center;font-size:14px;color:#555;margin-bottom:24px}
.pdf-table{width:100%;border-collapse:collapse;margin-bottom:16px}
.pdf-table td,.pdf-table th{border:1px solid #333;padding:8px 12px;font-size:13px;vertical-align:top}
.pdf-table th{background:#f0f0f0;font-weight:600;text-align:center}
.pdf-section{font-weight:700;margin:16px 0 8px;font-size:14px}
.pdf-sign-row{display:flex;justify-content:space-around;margin-top:40px}
.pdf-sign-col{text-align:center;min-width:120px}
.pdf-sign-line{border-top:1px solid #333;margin-top:40px;padding-top:6px;font-size:12px}
.pdf-date-row{text-align:right;font-size:13px;margin-bottom:16px}
.pdf-field{display:inline-block;min-width:120px;border-bottom:1px solid #333;margin:0 4px}
.pdf-check-row{margin:6px 0;font-size:13px}
.pdf-body{font-size:13px;line-height:2;margin-bottom:12px}

@media(max-width:640px){
  .flow-cards{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .sidebar{display:none}
  .content{padding:20px 16px}
}
</style>
</head>
<body>

<div id="print-area" style="display:none"></div>

<!-- Welcome -->
<div class="welcome" id="welcome">
  <div>
    <div class="welcome-logo">🏢 艾爾斯 HR 自動化系統</div>
    <div class="welcome-sub">請選擇要進行的流程</div>
  </div>
  <div class="flow-cards">
    <div class="flow-card" onclick="startFlow('onboard')">
      <div class="flow-card-icon">🎉</div>
      <div class="flow-card-title">員工入職</div>
      <div class="flow-card-desc">錄取通知 → 加保 → 到職當天 → 試用期追蹤</div>
    </div>
    <div class="flow-card" onclick="startFlow('offboard')">
      <div class="flow-card-icon">👋</div>
      <div class="flow-card-title">員工離職</div>
      <div class="flow-card-desc">離職申請 → 移交 → 退保 → 離職證明</div>
    </div>
    <div class="flow-card" onclick="startFlow('layoff')">
      <div class="flow-card-icon">⚖️</div>
      <div class="flow-card-title">資遣</div>
      <div class="flow-card-desc">資遣費試算 → 通報政府 → 資遣證明</div>
    </div>
    <div class="flow-card" onclick="openDashboard()" style="grid-column:1/-1;background:#f0efe9">

      <div class="flow-card-desc">查看所有入職、離職、資遣案件紀錄</div>
    </div>
  </div>
</div>

<!-- Dashboard -->
<div class="app" id="app-dashboard">

    <button class="header-back" onclick="goHome()">← 返回</button>

  <div style="padding:24px 32px;max-width:900px">

    </div>
    <div id="dash-content"></div>
  </div>
</div>

<!-- Onboard App -->
<div class="app" id="app-onboard">
  <div class="header">
    <button class="header-back" onclick="goHome()">← 返回</button>
    <div class="header-title">員工入職流程</div>
    <span class="header-badge badge-green" id="ob-badge">0 / 11</span>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill fill-green" id="ob-fill" style="width:0%"></div></div>

  </div>
  <div class="main">
    <div class="sidebar" id="ob-sidebar"></div>
    <div class="content" id="ob-content"></div>
  </div>
</div>

<!-- Offboard App -->
<div class="app" id="app-offboard">
  <div class="header">
    <button class="header-back" onclick="goHome()">← 返回</button>
    <div class="header-title">員工離職流程</div>
    <span class="header-badge badge-amber" id="off-badge">0 / 6</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill fill-amber" id="off-fill" style="width:0%"></div></div>
    <div class="progress-text" id="off-pct">0%</div>
  </div>
  <div class="main">
    <div class="sidebar" id="off-sidebar"></div>
    <div class="content" id="off-content"></div>
  </div>
</div>

<!-- Layoff App -->
<div class="app" id="app-layoff">
  <div class="header">
    <button class="header-back" onclick="goHome()">← 返回</button>
    <div class="header-title">資遣流程</div>
    <span class="header-badge badge-red" id="lay-badge">0 / 5</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill fill-red" id="lay-fill" style="width:0%"></div></div>
    <div class="progress-text" id="lay-pct">0%</div>
  </div>
  <div class="main">
    <div class="sidebar" id="lay-sidebar"></div>
    <div class="content" id="lay-content"></div>
  </div>
</div>

<script>
// ============================================================
// CONSTANTS
// ============================================================

// ── Firebase 同步設定 ──────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCiBIhDi_mshJIRISjABXEp2aQzFUxJjWk",
  authDomain:        "isec-hr-2.firebaseapp.com",
  databaseURL:       "https://isec-hr-2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "isec-hr-2",
  storageBucket:     "isec-hr-2.firebasestorage.app",
  messagingSenderId: "217885162451",
  appId:             "1:217885162451:web:c80f40d3762081ef9ecd26"
};

let db = null;
let fbReady = false;
let currentKey = null; // key for current employee in Firebase

function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    fbReady = true;
    setSyncDot(true, '已連線');
  } catch(e) {
    setSyncDot(false, '離線模式');
  }
}

function setSyncDot(ok, txt) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if(dot) dot.style.background = ok ? '#1a7a55' : '#c97a0a';
  if(label) label.textContent = txt;
}

function saveFirebase() {
  if(!fbReady || !db || !currentKey) return;
  db.ref('hr_ob/' + currentKey).set({emp, obDone, offDone, layDone, flowType: currentFlow||'onboard'}).catch(()=>setSyncDot(false,'同步失敗'));
}

function loadFirebase(key) {
  if(!fbReady || !db) return;
  currentKey = key;
  db.ref('hr_ob/' + key).on('value', snap => {
    const val = snap.val();
    if(val) {
      if(val.emp) emp = val.emp;
      if(val.obDone) obDone = val.obDone;
      if(val.offDone) offDone = val.offDone;
      if(val.layDone) layDone = val.layDone;
      // Render the current active flow
      if(currentFlow==='onboard') renderOb();
      else if(currentFlow==='offboard') renderOff();
      else if(currentFlow==='layoff') renderLay();
    }
    setSyncDot(true, '已同步');
  });
}

function nextWorkday(d) {
  let dt = new Date(d);
  dt.setDate(dt.getDate()+1);
  while(dt.getDay()===0 || dt.getDay()===6 || TW_HOLIDAYS.has(fmtDate(dt))) {
    dt.setDate(dt.getDate()+1);
  }
  return dt;
}

function addDays(d, n) {
  let dt = new Date(d); dt.setDate(dt.getDate()+n); return dt;
}

function nextWorkdayFrom(d) {
  let dt = new Date(d);
  while(dt.getDay()===0 || dt.getDay()===6 || TW_HOLIDAYS.has(fmtDate(dt))) {
    dt.setDate(dt.getDate()+1);
  }
  return dt;
}

function fmtDate(d) {
  return d.toISOString().split('T')[0];
}

function fmtDateZH(d) {
  const wd = ['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}（${wd[d.getDay()]}）`;
}

function fmtDateFormal(d) {
  return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
}

function goHome() {
  document.getElementById('welcome').style.display='flex';
  ['onboard','offboard','layoff','dashboard'].forEach(f=>{
    const el=document.getElementById('app-'+f);
    if(el) el.classList.remove('active');
  });
  currentFlow=null;
}

function startFlow(flow) {
  currentFlow=flow; emp={};
  document.getElementById('welcome').style.display='none';
  document.getElementById('app-'+flow).classList.add('active');
  if(flow==='onboard'){
    obStep=0;obDone=new Array(11).fill(false);
    if(!fbReady) initFirebase();
    // Ask for sync key (employee name or ID to share across devices)
    const key = prompt('請輸入員工姓名作為同步識別碼（例：童雲晞），相同識別碼的裝置會自動同步：');
    if(key && key.trim()) {
      const safeKey = key.trim().replace(/\s+/g,'_').replace(/[^\w\u4e00-\u9fff_]/g,'');
      currentKey = safeKey;
      loadFirebase(safeKey);
    } else {
      currentKey = null;
      renderOb();
    }
  }
  if(flow==='offboard'){offStep=0;offDone=new Array(6).fill(false);renderOff();}
  if(flow==='layoff'){layStep=0;layDone=new Array(5).fill(false);renderLay();}
}

// ============================================================
function renderSidebar(prefix, steps, cur, done) {
  const fnMap={ob:'goOb',off:'goOff',lay:'goLay'};
  const fn=fnMap[prefix];
  document.getElementById(prefix+'-sidebar').innerHTML=steps.map((s,i)=>`
    <div class="step-item ${i===cur?'active':''} ${done[i]?'done':''}" onclick="${fn}(${i})">
      <div class="step-num">${done[i]?'✓':(i+1)}</div>
      <div class="step-label">${s}</div>
    </div>`).join('');
}

function updateProgress(prefix, done, total) {
  const d=done.filter(Boolean).length;
  const pct=Math.round(d/total*100);
  document.getElementById(prefix+'-fill').style.width=pct+'%';

function saveObEmp(){
  const v=id=>document.getElementById(id).value.trim();
  const nameZh=v('f0'),nameEn=v('f1'),startDate=v('f3'),cid=v('f4'),dept=v('f5'),title=v('f6'),email=v('f7'),personalEmail=v('f8');
  if(!nameZh||!nameEn||!startDate||!cid||!dept||!title||!email||!personalEmail){alert('請填寫所有必填欄位！');return;}
  const co=COMPANIES.find(c=>c.id===cid);
  // Preserve all existing emp fields, just update the form fields
  emp=Object.assign(emp,{nameZh,nameEn,startDate,cid,companyName:co.name,companyTax:co.tax,dept,title,email,personalEmail});
  // Set currentKey from the prompt key (already set) or from nameZh
  if(!currentKey) currentKey=nameZh.replace(/\s+/g,'_').replace(/[^\w\u4e00-\u9fff_]/g,'');
  saveFirebase();
  obNext();
}

function handleEstellePhoto(input){
  if(!input.files||!input.files[0]) return;
  const file=input.files[0];
  const reader=new FileReader();
  reader.onload=function(e){
    emp.ePhotoData=e.target.result;
    saveFirebase();
    const preview=document.getElementById('estelle-photo-preview');
    const img=document.getElementById('estelle-photo-img');
    if(preview) preview.style.display='block';
    if(img) img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function downloadEstellePhoto(){
  if(!emp.ePhotoData) return;
  const link=document.createElement('a');
  link.href=emp.ePhotoData;
  link.download=(emp.nameZh||'employee')+'_大頭照.jpg';
  link.click();
}

function loadAllEmployees(){
  const el = document.getElementById('dash-content');
  el.innerHTML = '<div style="color:#6b6966;font-size:14px;padding:20px">從 Firebase 載入員工清單...</div>';
  if(!fbReady) initFirebase();
  function doLoad(){
    db.ref('hr_ob').once('value', snap => {
      allEmpRecords = snap.val() || {};
      renderEmployeeList();
    }).catch(e => {
      el.innerHTML = '<div class="alert alert-danger">載入失敗：' + e.message + '</div>';
    });
  }
  if(fbReady && db){ doLoad(); }
  else {
    let tries=0;
    const wait=setInterval(()=>{
      tries++;
      if(db&&fbReady){clearInterval(wait);doLoad();}
      if(tries>20){clearInterval(wait);
        el.innerHTML='<div class="alert alert-danger">Firebase 連線逾時，請重新整理頁面。</div>';
      }
    },300);
  }
}

function renderEmployeeList(){
  const el = document.getElementById('dash-content');
  const keys = Object.keys(allEmpRecords);

  if(keys.length === 0){
    el.innerHTML = '<div class="alert alert-info">Firebase 中尚無任何員工資料，請先進行入職/離職/資遣流程。</div>';
    return;
  }

  // Group by flow type
  const groups = {onboard:[], offboard:[], layoff:[]};
  keys.forEach(key => {
    const r = allEmpRecords[key];
    const e = r.emp || {};
    const type = r.flowType || (e.salary?'layoff':e.endDate&&!e.startDate?'offboard':'onboard');
    groups[type].push({key, record:r, emp:e});
  });

  const typeInfo = {
    onboard:{label:'🎉 入職', color:'#0f6e56', bg:'#e3f5ed'},
    offboard:{label:'👋 離職', color:'#7a4f0a', bg:'#fdf0d9'},
    layoff:{label:'⚖️ 資遣', color:'#8a1a1a', bg:'#fde8e8'},
  };

  let out = '<div style="margin-bottom:16px;font-size:13px;color:#6b6966">點選員工姓名查看未完成事項</div>';

  ['onboard','offboard','layoff'].forEach(type => {
    const items = groups[type];
    if(items.length === 0) return;
    const info = typeInfo[type];
    out += '<div style="margin-bottom:20px">';
    out += '<div style="font-size:12px;font-weight:700;color:'+info.color+';background:'+info.bg+';padding:5px 12px;border-radius:6px;display:inline-block;margin-bottom:8px">'+info.label+'</div>';
    out += '<div style="display:flex;flex-wrap:wrap;gap:8px">';
    items.forEach(({key, record, emp:e}) => {
      const doneArr = type==='onboard'?(record.obDone||[]):type==='offboard'?(record.offDone||[]):(record.layDone||[]);
      const total = type==='onboard'?11:type==='offboard'?6:5;
      const done = doneArr.filter(Boolean).length;
      const checks = record.emp&&record.emp._checks||{};
      const allDone = done===total;
      out += '<button data-key="'+key+'" data-type="'+type+'" onclick="selectEmployee(this.dataset.key,this.dataset.type)" style="'
        +'padding:10px 16px;border-radius:10px;border:1.5px solid '+(selectedEmpKey===key?info.color:'rgba(0,0,0,0.12)')+';'
        +'background:'+(selectedEmpKey===key?info.bg:'#fff')+';cursor:pointer;font-family:inherit;'
        +'font-size:13px;font-weight:600;color:#1a1917;transition:all 0.1s;text-align:left">'
        +'<div>'+((e.nameZh)||key)+'</div>'
        +'<div style="font-size:11px;color:#6b6966;margin-top:3px;font-weight:400">'+(e.title||'—')+'　'+done+'/'+total+' 完成</div>'
        +'</button>';
    });
    out += '</div></div>';
  });

  el.innerHTML = out;
  // If already selected, re-render pending
  if(selectedEmpKey) renderPending();
}

function selectEmployee(key, type){
  selectedEmpKey = key;
  selectedEmpType = type;
  renderEmployeeList();
  renderPending();
}

const STEP_LISTS = {
  onboard: OB_STEPS,
  offboard: OFF_STEPS,
  layoff: LAY_STEPS,
};
const DONE_KEYS = {onboard:'obDone', offboard:'offDone', layoff:'layDone'};
const TOTALS = {onboard:11, offboard:6, layoff:5};
const TYPE_COLORS = {onboard:'#0f6e56', offboard:'#7a4f0a', layoff:'#8a1a1a'};
const TYPE_BG = {onboard:'#e3f5ed', offboard:'#fdf0d9', layoff:'#fde8e8'};

function renderPending(){
  // Find or create pending area
  let pendingEl = document.getElementById('pending-area');
  if(!pendingEl){
    const dashEl = document.getElementById('dash-content');
    pendingEl = document.createElement('div');
    pendingEl.id = 'pending-area';
    pendingEl.style.marginTop = '24px';
    dashEl.parentNode.appendChild(pendingEl);
  }

  if(!selectedEmpKey){
    pendingEl.innerHTML = '';
    return;
  }

  const record = allEmpRecords[selectedEmpKey];
  if(!record){ pendingEl.innerHTML = ''; return; }

  const type = selectedEmpType;
  const e = record.emp || {};
  const doneArr = record[DONE_KEYS[type]] || [];
  const checks = (e._checks) || {};
  const steps = STEP_LISTS[type];
  const color = TYPE_COLORS[type];
  const bg = TYPE_BG[type];
  const checkDefs = PENDING_CHECKS[type] || {};

  // Pending steps
  const pendingSteps = steps.map((s,i)=>({label:s,i,done:doneArr[i]||false})).filter(s=>!s.done);
  // Pending checks grouped by step
  const pendingCheckList = Object.entries(checkDefs).filter(([id])=>!checks[id]);
  const byStep = {};
  pendingCheckList.forEach(([id,c])=>{
    if(!byStep[c.step]) byStep[c.step]=[];
    byStep[c.step].push({id,label:c.label});
  });

  let out = '<div style="background:'+bg+';border-radius:12px;padding:16px;border:0.5px solid rgba(0,0,0,0.1)">';
  out += '<div style="font-size:16px;font-weight:700;color:'+color+';margin-bottom:4px">'+(e.nameZh||selectedEmpKey)+'　未完成事項</div>';
  out += '<div style="font-size:13px;color:#6b6966;margin-bottom:16px">'+(e.title||'')+'　'+(e.companyName||'')+'</div>';

  if(pendingSteps.length === 0 && pendingCheckList.length === 0){
    out += '<div style="color:#1a7a55;font-weight:600">✅ 所有項目都已完成！</div>';
    out += '</div>';
    pendingEl.innerHTML = out;
    return;
  }

  // Pending steps
  if(pendingSteps.length > 0){
    out += '<div style="font-size:12px;font-weight:700;color:#6b6966;letter-spacing:0.06em;margin-bottom:8px">未完成步驟（點擊勾選）</div>';
    pendingSteps.forEach(s => {
      out += '<div data-key="'+selectedEmpKey+'" data-type="'+type+'" data-idx="'+s.i+'" onclick="toggleDashStep(this.dataset.key,this.dataset.type,parseInt(this.dataset.idx))" '
        +'style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-radius:8px;margin-bottom:6px;cursor:pointer;border:0.5px solid rgba(0,0,0,0.1)">'

        +'<div style="width:20px;height:20px;border:1.5px solid #ccc;border-radius:5px;flex-shrink:0"></div>'
        +'<span style="font-size:14px;font-weight:600">'+s.label+'</span>'
        +'</div>';
    });
  }

  // Pending checks
  if(pendingCheckList.length > 0){
    if(pendingSteps.length > 0) out += '<div style="height:12px"></div>';
    out += '<div style="font-size:12px;font-weight:700;color:#6b6966;letter-spacing:0.06em;margin-bottom:8px">未完成細項（點擊勾選）</div>';
    Object.entries(byStep).forEach(([step, items]) => {
      out += '<div style="margin-bottom:10px">';
      out += '<div style="font-size:12px;color:#9a9894;margin-bottom:5px">↳ '+step+'</div>';
      items.forEach(({id,label}) => {
        out += '<div data-key="'+selectedEmpKey+'" data-type="'+type+'" data-id="'+id+'" onclick="toggleDashCheck(this.dataset.key,this.dataset.type,this.dataset.id)" '
          +'style="display:flex;align-items:center;gap:10px;padding:8px 14px 8px 26px;background:#fff;border-radius:8px;margin-bottom:5px;cursor:pointer;border:0.5px solid rgba(0,0,0,0.08)">'

          +'<div style="width:18px;height:18px;border:1.5px solid #ccc;border-radius:4px;flex-shrink:0"></div>'
          +'<span style="font-size:13px">'+label+'</span>'
          +'</div>';
      });
      out += '</div>';
    });
  }

  out += '</div>';
  pendingEl.innerHTML = out;
}

function toggleDashStep(key, type, stepIdx){
  if(!allEmpRecords[key]) return;
  const doneKey = DONE_KEYS[type];
  const total = TOTALS[type];
  let doneArr = allEmpRecords[key][doneKey] || new Array(total).fill(false);
  doneArr[stepIdx] = true;
  allEmpRecords[key][doneKey] = doneArr;
  // Save to Firebase
  db.ref('hr_ob/'+key+'/'+doneKey).set(doneArr).then(()=>{
    renderEmployeeList();
    renderPending();
  });
}

function toggleDashCheck(key, type, checkId){
  if(!allEmpRecords[key]) return;
  if(!allEmpRecords[key].emp) allEmpRecords[key].emp = {};
  if(!allEmpRecords[key].emp._checks) allEmpRecords[key].emp._checks = {};
  allEmpRecords[key].emp._checks[checkId] = true;
  // Save to Firebase
  db.ref('hr_ob/'+key+'/emp/_checks/'+checkId).set(true).then(()=>{
    renderEmployeeList();
    renderPending();
  });
}

function printDoc(html, filename=''){
  const pa=document.getElementById('print-area');
  pa.innerHTML=html;
  pa.style.display='block';
  if(filename){
    // Set document title temporarily so browser uses it as PDF filename
    const origTitle = document.title;
    document.title = filename;
    setTimeout(()=>{
      window.print();
      pa.style.display='none';
      document.title = origTitle;
    },300);
  } else {
    setTimeout(()=>{window.print();pa.style.display='none';},300);
  }
}

  return `<div class="section-card"><div class="alert alert-warn">⚠️ 請先填寫員工資料（步驟 1）。</div><div class="btn-row"><button class="btn btn-primary" onclick="${fn}">← 回到填資料</button></div></div>`;
}

let ciCounter=0;
function ci(id,label,note=''){
  return `<div class="check-item" id="ci-${id}" onclick="toggleCI('${id}')">
    <div class="checkbox" id="cb-${id}"></div>
    <div style="flex:1"><div class="check-label">${label}</div>${note?`<div class="check-note">${note}</div>`:''}</div>
  </div>`;
}

function toggleCI(id){
  const el=document.getElementById('ci-'+id);
  const cb=document.getElementById('cb-'+id);
  if(!el)return;
  el.classList.toggle('done');
  const isDone=el.classList.contains('done');
  cb.textContent=isDone?'✓':'';
  // Save checkbox state to emp for Firebase sync
  if(!emp._checks) emp._checks={};
  emp._checks[id]=isDone;
  saveFirebase();
}

function restoreChecks(){
  if(!emp._checks) return;
  Object.entries(emp._checks).forEach(([id,done])=>{
    const el=document.getElementById('ci-'+id);
    const cb=document.getElementById('cb-'+id);
    if(!el) return;
    if(done){el.classList.add('done');}
    else{el.classList.remove('done');}
    if(cb) cb.textContent=done?'✓':'';
  });
}

function copyEl(id){
  const el=document.getElementById(id);
  if(!el)return;
  navigator.clipboard.writeText(el.innerText||el.textContent).then(()=>alert('✅ 已複製！')).catch(()=>{
    const t=document.createElement('textarea');t.value=el.innerText;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);alert('✅ 已複製！');
  });
}
</script>
</body>
